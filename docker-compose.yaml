services:
  zipvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zipvault
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: folders
    restart: always

